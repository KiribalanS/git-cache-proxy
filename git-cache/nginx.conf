daemon off;
worker_processes auto;

user nginx nginx;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    upstream fcgiwrap {
        server unix:/var/run/fcgiwrap.socket;
    }

    error_log /dev/stderr warn;

    server {
        listen 8765;
        access_log /dev/stdout;
        error_log /dev/stderr warn;
        server_name localhost;

        location / {
            return 200;
        }

        location ~ .*/(?:info/refs|git-upload-pack)$ {
            error_log /dev/stderr warn;

            # Longer timeouts for large repos to have time to cache. 500s
            # was not enough in practice for a ~1.7M-object repo -- the
            # clone kept running server-side well past the client-facing
            # timeout (confirmed via ps: nothing was lost, but the client
            # saw a stalled connection). Sized generously for a large
            # monorepo's first (cold) clone, not tuned to a measured worst
            # case for this fork specifically.
            fastcgi_read_timeout 3600;
            fastcgi_send_timeout 3600;

            fastcgi_pass fcgiwrap;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /usr/local/bin/git-cache-handler.sh;
            fastcgi_param PATH_INFO $uri;
            fastcgi_param GIT_PROJECT_ROOT /repo-cache;
            fastcgi_param GIT_HTTP_EXPORT_ALL "1";
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_intercept_errors on;
        }
    }
}